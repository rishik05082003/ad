<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>LeanMode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0f14'/%3E%3Cpath d='M32 10c-2 10-14 14-14 28a14 14 0 0 0 28 0c0-14-12-18-14-28z' fill='%23b6ff3c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
</div>
<nav id="nav">
  <button data-act="tab" data-tab="today"><i>◔</i><span>Today</span></button>
  <button data-act="tab" data-tab="foods"><i>⌕</i><span>Foods</span></button>
  <button class="fab" data-act="add" aria-label="Add food"><b>+</b></button>
  <button data-act="tab" data-tab="trends"><i>▤</i><span>Trends</span></button>
  <button data-act="tab" data-tab="settings"><i>⚙</i><span>Settings</span></button>
</nav>
<div id="sheet-root"></div>
<div id="toast"></div>
<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file-gal" accept="image/*" multiple hidden>
<script src="app.js" type="module"></script>
</body>
</html>
